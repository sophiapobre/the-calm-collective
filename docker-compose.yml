services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend/public/images:/app/public/images
    environment:
      - NODE_ENV=production
      # MongoDB Atlas connection string should be set via .env file
      - MONGO_URL=${MONGO_URL}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production